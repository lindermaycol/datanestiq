  - observabilidad
  - data products
  - ELT
  - integración de datos
copilotPrompts:
  - >-
    Diagnosticar cuellos de botella y latencia en nuestro pipeline de datos
    actual on-premise.
  - >-
    Diseñar roadmap de migración hacia Arquitectura Medallion
    (Bronze/Silver/Gold) en cloud.
techStack:
  - Snowflake
  - Databricks
  - Apache Spark
  - Kafka
  - Iceberg
proofPoints:
  - client: Banco Regional
    result: '[EST] 10x velocidad en pipelines de datos nocturnos'
competitivePositioning: >-
  Construimos Arquitecturas Lakehouse con open-formats (Apache Iceberg, Delta)
  que previenen el vendor lock-in a diferencia de ecosistemas cerrados y
  costosos de legacy data warehouses.
contentAngles:
  - id: data-lake-vs-data-warehouse-cdo
    title: 'Lakehouse: Lo mejor de ambos mundos'
    brief: >-
      Explicación técnica para el CDO sobre cómo una arquitectura Data Lakehouse
      resuelve el problema de silos sin los costos inflexibles de un Data
      Warehouse tradicional.
