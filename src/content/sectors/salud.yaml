  - Redes de Salud Integradas
  - Seguros de Salud
kpis:
  - metric: Reducción de readmisiones
    expectedRoi: '[EST] 15% de reducción'
  - metric: Optimización de camas hospitalarias
    expectedRoi: '[EST] 20% más disponibilidad'
regulations:
