roiCases:
  - title: "Agentes de IA para Análisis Clínico e IDP"
    description: "Desarrollo de Sistemas Digitales Premium apoyados por NLP y LLMs privados (GenAI) para extraer, estructurar y anonimizar entidades médicas."
    context: "Red hospitalaria procesando manualmente miles de reportes médicos no estructurados bajo cumplimiento HIPAA."
    metrics:
      - value: "100x"
        label: "Velocidad de extracción"
