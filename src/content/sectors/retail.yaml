  - ceo
  - cdo
contentAngles:
  - id: forecast-demanda-retail
    title: Predicción de Demanda con Machine Learning
    brief: >-
      Artículo para el COO detallando cómo los algoritmos de predicción de
      demanda reducen los quiebres de stock y optimizan el capital de trabajo en
      el retail.
