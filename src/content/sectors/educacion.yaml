seo:
  title: Analítica Predictiva e IA para Educación | Datanestiq
  description: >-
    Modelos predictivos de retención estudiantil y ecosistemas de datos
    unificados para instituciones de educación superior.
hero:
  headline: Inteligencia Académica y Retención Estudiantil
  subheadline: >-
    Intervenciones proactivas impulsadas por datos. Asegure el éxito de sus
    estudiantes y el crecimiento institucional mediante IA educativa.
contrast:
  problem: >-
    Altas tasas de abandono detectadas cuando ya es tarde e incapacidad técnica
    para personalizar la currícula a escala masiva.
  solution: >-
    Modelos que detectan patrones de riesgo de deserción tempranamente y motores
    de recomendación para adaptar el aprendizaje a cada estudiante.
problems:
  - code: desercion
    label: Altas tasas de abandono (Churn)
    solution: >-
      Desplegamos modelos predictivos que detectan patrones de riesgo de
      deserción estudiantil con meses de anticipación, permitiendo
      intervenciones tempranas.
  - code: personalizacion
    label: Dificultad para personalizar el aprendizaje
    solution: >-
      Integramos sistemas cognitivos que analizan el rendimiento individual para
      generar trayectorias de aprendizaje hiper-personalizadas a escala.
