id: sector-educacion
title: Educación
description: >-
  Prevención de deserción escolar, hiper-personalización del aprendizaje y
  analítica para gestión académica.
icon: ph-graduation-cap
ciiu: '85'
keywords:
  - educación
  - universidades
  - edtech
  - deserción
  - estudiantes
  - aprendizaje
  - analítica académica
  - retención estudiantil
  - aprendizaje adaptativo
