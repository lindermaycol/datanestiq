contentAngles:
  - id: mantenimiento-predictivo-iot
    title: Mantenimiento Predictivo con IoT e IA
    brief: >-
      Caso de uso dirigido al Director de Operaciones (COO) sobre cómo procesar
      datos de sensores IoT en tiempo real previene paradas de planta
      millonarias.
