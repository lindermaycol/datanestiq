  - Consumo Masivo
  - Maquinaria Pesada
kpis:
  - metric: Mejora del OEE (Eficiencia General)
    expectedRoi: '[EST] +20%'
  - metric: Costos de mantenimiento no planificado
    expectedRoi: '[EST] -25%'
regulations:
